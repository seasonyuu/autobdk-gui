<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>考勤管理</title>
  </head>
  <body>
    <div class="top-bar">
      <div class="app-title">
        <span class="app-mark" aria-hidden="true"></span>
        <span class="app-title-text">考勤管理</span>
        <span class="app-title-subtitle">Attendance Desk</span>
      </div>
      <div class="top-bar-menu">
        <div class="settings-menu-container">
          <button id="settings-menu-btn" class="top-bar-btn">
            <span>设置</span>
            <svg class="ui-icon menu-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <div id="settings-dropdown" class="settings-dropdown hidden">
            <div class="dropdown-header">设置选项</div>
            <button id="checkin-settings-menu-item" class="dropdown-menu-item">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              <span>补签时间设置</span>
            </button>
            <button id="view-cookies-menu-item" class="dropdown-menu-item">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4h6l1 2h3v14H5V6h3l1-2Z"/><path d="M9 11h6"/><path d="M9 15h4"/></svg>
              <span>查看 Cookie</span>
            </button>
            <button id="open-login-menu-item" class="dropdown-menu-item">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.6-1.7"/></svg>
              <span>打开登录页</span>
            </button>
            <button id="clear-cookies-menu-item" class="dropdown-menu-item danger">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
              <span>清空 Cookie</span>
            </button>
          </div>
        </div>
        <div class="user-menu-container">
          <button id="user-menu-btn" class="top-bar-btn">
            <span id="user-display-name">未登录</span>
            <svg class="ui-icon menu-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <div id="user-dropdown" class="user-dropdown hidden">
            <div class="dropdown-header">用户信息</div>
            <div class="dropdown-item">
              <span class="item-label">公司：</span>
              <span id="dropdown-company" class="item-value">-</span>
            </div>
            <div class="dropdown-item">
              <span class="item-label">员工：</span>
              <span id="dropdown-employee" class="item-value">-</span>
            </div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item">
              <span class="item-label">CSRF Token：</span>
              <div id="dropdown-csrf" class="item-value csrf-value">-</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="app-notice" class="app-notice hidden" role="status" aria-live="polite">
      <div class="app-notice-mark" aria-hidden="true"></div>
      <div class="app-notice-copy">
        <div id="app-notice-title" class="app-notice-title">提示</div>
        <div id="app-notice-message" class="app-notice-message"></div>
      </div>
      <button id="app-notice-close-btn" class="app-notice-close-btn" aria-label="关闭提示">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="container">
      <div class="left-content">
        <div id="calendar-container" class="calendar-container"></div>
      </div>
      <div id="webview-container"></div>
    </div>

    <!-- App Confirm Dialog Modal -->
    <div id="app-confirm-dialog" class="dialog-overlay hidden">
      <div class="dialog-container app-confirm-container" role="dialog" aria-modal="true" aria-labelledby="app-confirm-title" aria-describedby="app-confirm-message">
        <div class="dialog-header">
          <h3 id="app-confirm-title">确认操作</h3>
          <button id="app-confirm-close-btn" class="dialog-close-btn" aria-label="关闭"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg></button>
        </div>
        <div class="dialog-body app-confirm-body">
          <p id="app-confirm-message" class="app-confirm-message"></p>
        </div>
        <div class="settings-dialog-actions">
          <button id="app-confirm-cancel-btn" class="checkin-btn checkin-btn-cancel">取消</button>
          <button id="app-confirm-ok-btn" class="checkin-btn checkin-btn-primary">确认</button>
        </div>
      </div>
    </div>

    <!-- Check-in Settings Dialog Modal -->
    <div id="checkin-settings-dialog" class="dialog-overlay hidden">
      <div class="dialog-container settings-dialog-container">
        <div class="dialog-header">
          <h3>补签时间设置</h3>
          <button id="checkin-settings-close-btn" class="dialog-close-btn" aria-label="关闭"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg></button>
        </div>
        <div class="dialog-body settings-dialog-body">
          <p class="settings-dialog-help">设置一键打卡自动生成补签申请时使用的上班和下班时间。</p>
          <div class="settings-form-grid">
            <label class="settings-field" for="checkin-start-time-input">
              <span class="settings-field-label">上班补签时间</span>
              <input id="checkin-start-time-input" class="settings-time-input" type="time" step="60" />
            </label>
            <label class="settings-field" for="checkin-end-time-input">
              <span class="settings-field-label">下班补签时间</span>
              <input id="checkin-end-time-input" class="settings-time-input" type="time" step="60" />
            </label>
          </div>
          <div id="checkin-settings-message" class="settings-message" aria-live="polite"></div>
        </div>
        <div class="settings-dialog-actions">
          <button id="checkin-settings-reset-btn" class="checkin-btn checkin-btn-cancel">恢复默认</button>
          <button id="checkin-settings-save-btn" class="checkin-btn checkin-btn-primary">保存设置</button>
        </div>
      </div>
    </div>

    <!-- Cookie Dialog Modal -->
    <div id="cookie-dialog" class="dialog-overlay hidden">
      <div class="dialog-container">
        <div class="dialog-header">
          <h3>Cookie 管理</h3>
          <button id="close-dialog-btn" class="dialog-close-btn" aria-label="关闭"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg></button>
        </div>
        <div class="dialog-body">
          <div id="cookie-dialog-display" class="cookie-dialog-display"></div>
        </div>
      </div>
    </div>

    <!-- Floating Action Button -->
    <button id="quick-checkin-fab" class="fab">一键打卡</button>

    <!-- Quick Check-in Dialog -->
    <div id="checkin-dialog" class="dialog-overlay hidden">
      <div class="dialog-container checkin-dialog-container">
        <div class="dialog-header">
          <h3 id="checkin-dialog-title">一键打卡</h3>
          <button id="checkin-dialog-close-btn" class="dialog-close-btn" aria-label="关闭"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg></button>
        </div>
        <div class="dialog-body">
          <div id="checkin-dialog-content" class="checkin-dialog-content"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
